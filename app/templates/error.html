<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{headline} — Carnegie ROI</title>
  <style>
    html, body {{
      margin: 0;
      padding: 0;
      height: 100%;
      background: #F8F4F0;
    }}
    body {{
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      color: #021326;
    }}
    .card {{
      background: #ffffff;
      border-left: 5px solid #EA332D;
      box-shadow: 0 6px 24px rgba(2, 19, 38, 0.08);
      border-radius: 6px;
      padding: 40px 48px;
      max-width: 480px;
      width: calc(100% - 48px);
    }}
    .brand {{
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #EA332D;
      margin-bottom: 14px;
      font-weight: 600;
    }}
    h1 {{
      font-family: 'Lora', Georgia, 'Times New Roman', serif;
      font-weight: 300;
      font-size: 28px;
      line-height: 1.25;
      margin: 0 0 16px 0;
      color: #021326;
    }}
    p {{
      font-size: 15px;
      line-height: 1.55;
      color: #4a5461;
      margin: 0 0 20px 0;
    }}
    .hint {{
      font-size: 13px;
      color: #8b94a1;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #eee4dc;
    }}
  </style>
</head>
<body>
  <main class="card" role="alert" aria-live="polite">
    <div class="brand">Carnegie ROI Report</div>
    <h1>{headline}</h1>
    <p>{message}</p>
    <div class="hint">If the issue persists, please contact your Carnegie account team.</div>
  </main>
</body>
</html>
