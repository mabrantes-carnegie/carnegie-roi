name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main
      - dev
      - feature/gcp_deploy

env:
  PROJECT_ID: carnegie-roi-reports
  REGION: us-east4

jobs:
  deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for WIF OIDC token

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set environment
        id: env
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "environment=prod" >> "$GITHUB_OUTPUT"
            echo "repo_name=roi-reports" >> "$GITHUB_OUTPUT"
            echo "service_name=roi-reports" >> "$GITHUB_OUTPUT"
          else
            echo "environment=dev" >> "$GITHUB_OUTPUT"
            echo "repo_name=roi-reports-dev" >> "$GITHUB_OUTPUT"
            echo "service_name=roi-reports-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -f app/Dockerfile \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ steps.env.outputs.repo_name }}/roi-reports-app:latest \
            .

      - name: Push Docker image
        run: docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ steps.env.outputs.repo_name }}/roi-reports-app:latest

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="prefix=roi-report/terraform/state/${{ steps.env.outputs.environment }}"

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="image_tag=latest" \
            -var="environment=${{ steps.env.outputs.environment }}"

      - name: Force new Cloud Run revision
        run: |
          gcloud run services update ${{ steps.env.outputs.service_name }} \
            --region=${{ env.REGION }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ steps.env.outputs.repo_name }}/roi-reports-app:latest \
            --project=${{ env.PROJECT_ID }}

      - name: Output Cloud Run URL
        working-directory: terraform
        run: terraform output cloud_run_url
